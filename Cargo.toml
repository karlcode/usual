[package]
name = "usual"
version = "0.2.0"
edition = "2021"
description = "Shows a project's likely next command on the zsh prompt"
license = "MIT"
repository = "https://github.com/karlcode/usual"
publish = false

[[bin]]
name = "usual"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
